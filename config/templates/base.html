{% load static %}
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HAVEN{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/tailwind.output.css' %}">
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="icon" href="{% static 'images/haven_logo.svg' %}" type="image/x-icon">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    {% block extra_head %}{% endblock %}
    {% block extra_scripts %}{% endblock %}
</head>
<body class="bg-gray-50 font-sans">
    <c-navbar></c-navbar>

    {% block content %}{% endblock %}
    <c-footer></c-footer>
    <script>lucide.createIcons();</script>
</body>
<script>
    document.body.addEventListener('htmx:configRequest', (e) => {
        e.detail.headers['X-CSRFToken'] = '{{ csrf_token }}';
    });
    // 1. Script de détection immédiate (à placer idéalement dans le <head> pour éviter le flash blanc)
if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.classList.add('dark');
} else {
    document.documentElement.classList.remove('dark');
}

// 2. Écouteur de clic (à exécuter une fois le DOM chargé)
document.addEventListener('DOMContentLoaded', () => {
    const themeToggleBtn = document.getElementById('theme-toggle');

    if (themeToggleBtn) {
        themeToggleBtn.addEventListener('click', () => {
            // Si la classe dark y est, on l'enlève, sinon on la rajoute
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        });
    }
});
</script>

</html>
