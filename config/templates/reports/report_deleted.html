{% extends 'base.html' %}
{% block title %}Signalement annulé — HAVEN{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-6">

        <div class="w-16 h-16 bg-gray-50 rounded-full flex items-center justify-center mx-auto mb-4">
            <i data-lucide="trash-2" class="w-8 h-8 text-gray-400"></i>
        </div>
        <h1 class="text-xl font-bold text-slate-800 mb-2">Signalement annulé</h1>
        <p class="text-sm text-gray-400 mb-6">Votre signalement a bien été supprimé.</p>
        <a href="{% url 'home' %}" class="inline-flex items-center gap-2 bg-orange-500 text-white font-semibold px-6 py-2.5 rounded-xl text-sm hover:bg-orange-600 transition-colors">
            <i data-lucide="house" class="w-4 h-4"></i> Retour à l'accueil
        </a>
    </div>
</div>
{% endblock %}
