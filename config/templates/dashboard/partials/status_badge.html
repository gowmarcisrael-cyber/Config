<span class="status-badge text-xs font-semibold px-2.5 py-1 rounded-full
    {% if listing.status == 'A louer' %}bg-green-100 text-green-800
    {% elif listing.status == 'En vente' %}bg-blue-100 text-blue-800
    {% elif listing.status == 'Vendu' %}bg-gray-100 text-gray-600
    {% else %}bg-yellow-100 text-yellow-800{% endif %}">
    {{ listing.status }}
</span>
