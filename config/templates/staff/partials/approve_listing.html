<button hx-post="{% url 'staff_approve_listing' listing.slug %}"
        hx-target="this"
        hx-swap="outerHTML"
        class="inline-flex items-center gap-1.5 text-xs font-bold px-3 py-1.5 rounded-lg transition-colors group border
            {% if listing.is_approved %}
                bg-emerald-50 text-emerald-700 border-emerald-200/50 hover:bg-rose-50 hover:text-rose-600 hover:border-rose-200/50
            {% else %}
                bg-amber-50 text-amber-700 border-amber-200/50 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-200/50
            {% endif %}">
    
    {% if listing.is_approved %}
        <svg class="shrink-0 text-emerald-600 group-hover:text-rose-500 transition-colors" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        <span class="group-hover:hidden">Approuvée</span>
        <span class="hidden group-hover:inline">Désapprouver</span>
    {% else %}
        <svg class="shrink-0 text-amber-600 group-hover:text-emerald-600 transition-colors" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span class="group-hover:hidden">En attente</span>
        <span class="hidden group-hover:inline">Approuver</span>
    {% endif %}
</button>
