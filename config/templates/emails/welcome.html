<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      margin-top: 20px;
      cursor: pointer;
    }

    h1 {
      color: #111827;
    }

    p {
      color: #4b5563;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Bienvenue {{ user.username }} 👋</h1>

    <p>Merci de rejoindre notre plateforme immobilière.</p>

    <p>Pour activer ton compte :</p>

    <a href="{{ activation_link }}" class="btn">
      Activer mon compte
    </a>
    <p>
      ou sinon ouvre ce lien dans ton navigateur : {{ activation_link }}
    </p>

    <p style="margin-top:20px; font-size:12px; color:gray;">
      Si ce n'est pas toi, ignore cet email.
    </p>
  </div>
</body>
</html>
