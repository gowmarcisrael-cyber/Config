<div style="font-family: sans-serif; max-width: 600px; margin: 0 auto;">
    <h1 style="color: #f97316;">HAVEN</h1>
    <p>Bonjour {{ user.username }},</p>
    <p>Vous avez demandé une réinitialisation de votre mot de passe.</p>
    <a href="{{ protocol }}://{{ domain }}{% url 'password_reset_confirm' uidb64=uid token=token %}"
       style="background:#f97316;color:white;padding:10px 24px;border-radius:8px;text-decoration:none;font-weight:600;display:inline-block;margin:16px 0;">
        Réinitialiser mon mot de passe
    </a>
    <p style="font-size:12px;color:gray;">Si vous n'avez pas demandé cette réinitialisation, ignorez cet email.</p>
</div>
