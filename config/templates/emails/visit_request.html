<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; color: #1e293b; }
        .logo { font-size: 28px; font-weight: 800; color: #f97316; text-align: center; margin-bottom: 30px; }
        .card { background: #f8fafc; border-radius: 12px; padding: 20px; margin: 20px 0; }
        .label { font-size: 11px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        .value { font-size: 14px; color: #1e293b; font-weight: 500; }
        .btn { display: inline-block; background: #f97316; color: white; padding: 12px 28px; border-radius: 8px; text-decoration: none; font-weight: 600; margin: 20px 0; }
        .footer { margin-top: 30px; font-size: 12px; color: #94a3b8; text-align: center; border-top: 1px solid #e2e8f0; padding-top: 20px; }
    </style>
</head>
<body>
    <p class="logo">HAVEN</p>

    <p>Bonjour,</p>
    <p>Vous avez reçu une nouvelle demande de visite de <strong>{{ sender }}</strong> pour votre annonce.</p>

    <div class="card">
        <div style="margin-bottom: 12px;">
            <p class="label">Annonce</p>
            <p class="value">{{ listing.title }}</p>
        </div>
        <div style="margin-bottom: 12px;">
            <p class="label">Date souhaitée</p>
            <p class="value">{{ date|date:"d/m/Y à H:i" }}</p>
        </div>
        {% if message %}
        <div>
            <p class="label">Message</p>
            <p class="value">{{ message }}</p>
        </div>
        {% endif %}
    </div>

    <div style="text-align: center;">
        <a href="{{ listing_url }}" class="btn">Voir l'annonce →</a>
    </div>

    <div class="footer">
        <p>© 2025 HAVEN — Immobilier de confiance</p>
    </div>
</body>
</html>
