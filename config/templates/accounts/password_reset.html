{% extends 'base.html' %}
{% block title %}Mot de passe oublié — HAVEN{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-orange-500 mb-1">HAVEN</h1>
            <p class="text-gray-400 text-sm">Réinitialisez votre mot de passe</p>
        </div>
        <div class="bg-white border border-gray-100 rounded-2xl p-8">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Email</label>
                    <input type="email" name="email" placeholder="votre@email.com"
                           class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400">
                </div>
                <button type="submit"
                        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-xl text-sm transition-colors">
                    Envoyer le lien
                </button>
            </form>
            <p class="text-center text-sm text-gray-400 mt-6">
                <a href="{% url 'login' %}" class="text-orange-500 font-medium hover:underline">← Retour à la connexion</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
