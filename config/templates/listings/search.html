{% extends 'base.html' %}
{% load listing_tags %}
{% load static %}
{% block title %}HAVEN — Immobilier{% endblock %}

{% block content %}
<!-- Hero + Filtres -->
<c-hero></c-hero>

<!-- Annonces -->
<div class="max-w-6xl mx-auto px-6 py-10">
    <div class="flex items-center justify-between mb-6">
        <h2 class="text-lg font-semibold text-slate-800">Annonces récentes
            <span class="text-gray-400 font-normal text-sm">· {{ listings|length }} résultats</span>
        </h2>
        <a href="{% url 'search' %}" class="text-sm text-orange-500 font-medium hover:underline">Voir tout →</a>
    </div>

    <div id="listings-results">
        {% include 'listings/partials/listings_results.html' %}
    </div>
</div>
<script>
    const cityInput = document.getElementById('city-input');
    const citySuggestions = document.getElementById('city-suggestions');

    cityInput.addEventListener('input', function () {
        const q = this.value;
        if (q.length < 2) {
            citySuggestions.classList.add('hidden');
            return;
        }

        fetch(`/autocomplete/cities/?q=${encodeURIComponent(q)}`)
            .then(res => res.json())
            .then(cities => {
                if (cities.length === 0) {
                    citySuggestions.classList.add('hidden');
                    return;
                }
                citySuggestions.innerHTML = cities.map(city => `
                <div class="px-4 py-2 text-sm text-gray-600 hover:bg-orange-50 hover:text-orange-500 cursor-pointer city-option">
                    📍 ${city}
                </div>
            `).join('');
                citySuggestions.classList.remove('hidden');

                citySuggestions.querySelectorAll('.city-option').forEach(option => {
                    option.addEventListener('click', function () {
                        cityInput.value = this.textContent.replace('📍 ', '').trim();
                        citySuggestions.classList.add('hidden');
                    });
                });
            });
    });

    document.addEventListener('click', function (e) {
        if (!cityInput.contains(e.target) && !citySuggestions.contains(e.target)) {
            citySuggestions.classList.add('hidden');
        }
    });
</script>
<script src="{% static 'js/map.js' %}"></script>
{% endblock %}
