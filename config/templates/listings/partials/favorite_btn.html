<button
    hx-post="{% url 'toggle-favorite' listing.pk %}"
    hx-target="this"
    hx-swap="outerHTML"
    class="flex items-center justify-center w-8 h-8 rounded-full transition-colors
    {% if is_favorite %}
        bg-red-50 text-red-500
    {% else %}
        bg-gray-100 text-gray-400 hover:bg-red-50 hover:text-red-400
    {% endif %}">

    {% if is_favorite %}
        ❤️
    {% else %}
        🤍
    {% endif %}
</button>
