<button
    hx-post="{% url 'toggle-favorite' listing.slug %}"
    hx-target="this"
    hx-swap="outerHTML"
    class="flex items-center justify-center w-8 h-8 rounded-full transition-colors
    {% if is_favorite %}
       text-red-500
    {% else %}
        text-gray-400  hover:text-red-400
    {% endif %}">

    {% if is_favorite %}
        ❤️
    {% else %}
        🤍
    {% endif %}
</button>
